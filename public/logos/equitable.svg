<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 52" role="img" aria-label="Equitable Life">
  <!-- EQ mark: square rotated 45deg with inner cutout -->
  <rect x="12" y="16" width="22" height="22" rx="3" transform="rotate(45 23 27)" fill="#003087"/>
  <rect x="17" y="21" width="12" height="12" rx="2" transform="rotate(45 23 27)" fill="white"/>
  <!-- Wordmark -->
  <text x="48" y="24" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="0.2" fill="#003087">Equitable</text>
  <text x="48" y="41" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="400" letter-spacing="1.8" fill="#003087">LIFE</text>
</svg>
